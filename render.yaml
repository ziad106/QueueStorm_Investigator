services:
  - type: web
    name: queuestorm-investigator
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Optional LLM polish layer. Decision fields stay deterministic regardless.
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: LLM_TIMEOUT
        value: "8"
      # Set the real value in the Render dashboard (kept out of git).
      - key: GEMINI_API_KEY
        sync: false
