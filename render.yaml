services:
  - type: web
    name: queuestorm-investigator
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Optional LLM polish layer is OFF by default for judging: on Render's free
      # 0.1-CPU instance, concurrent outbound LLM calls can cause sporadic 520s.
      # Deterministic mode is uniform ~6ms and never 5xx. To enable the polish for
      # a demo, set LLM_PROVIDER=gemini and add GEMINI_API_KEY in the dashboard.
      - key: LLM_PROVIDER
        value: ""
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: LLM_TIMEOUT
        value: "6"
      # Set the real value in the Render dashboard (kept out of git).
      - key: GEMINI_API_KEY
        sync: false
