services:
  - type: web
    name: queuestorm-investigator
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Optional LLM polish layer. Decisions/safety stay deterministic regardless.
      # A concurrency cap (LLM_MAX_INFLIGHT) sheds load to deterministic templates
      # under bursts so the free 0.1-CPU instance is not overwhelmed (avoids 520s).
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: LLM_TIMEOUT
        value: "6"
      - key: LLM_MAX_INFLIGHT
        value: "2"
      # Set the real value in the Render dashboard (kept out of git).
      - key: GEMINI_API_KEY
        sync: false
